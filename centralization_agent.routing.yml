centralization_agent.status_page:
  path: '/admin/reports/centralization-agent'
  defaults:
    _controller: '\Drupal\centralization_agent\Controller\CentralizationAgentController::load'
  methods: [GET]
  requirements:
    _custom_access: 'centralization_agent.token_access_check:access'
    _format: 'json'

centralization_agent.cache_clear:
  path: '/admin/reports/centralization-agent/cc/{centralization_agent_id}'
  defaults:
    _controller: '\Drupal\centralization_agent\Controller\CentralizationAgentController::cache_clear'
  methods: [GET]
  requirements:
    _custom_access: 'centralization_agent.token_access_check:access'
    _format: 'json'

centralization_agent.admin_settings:
  path: '/admin/config/system/centralization-agent-configuration'
  defaults:
    _form: '\Drupal\centralization_agent\Form\CentralizationAgentSettingsForm'
    _title: 'System status'
  requirements:
    _permission: 'administer site configuration'

